worker_processes 1;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    resolver 127.0.0.11 valid=30s ipv6=off;

    server {
        listen 80;

        # Servir arquivos estáticos
        location /static/ {
            root /etc/nginx/staticfiles/;
        }

        # Proxy para o Gunicorn 
        location / {
            # Resolve middleware service name dynamically to avoid stale upstream IP after container recreation.
            set $middleware_upstream middleware:8000;
            proxy_pass http://$middleware_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
